<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>MyGitHub — Metronomo e Studio</title>
    <meta
      name="description"
      content="Metronomo avanzato, libreria di brani con tracking automatico del BPM, accordatore per chitarra e registro delle corde."
    />
    <meta name="theme-color" content="#080808" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyGitHub" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg?v=pick-1" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=pick-1" />
    <link rel="apple-touch-startup-image" href="/icons/apple-touch-icon.png?v=pick-1" />
    <style>
      html,
      body {
        margin: 0;
        background: #080808;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #050505;
        z-index: 9999;
        transition: opacity 0.48s ease;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .mark {
        width: min(58vw, 232px);
        height: min(58vw, 232px);
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 16px 36px rgba(255,255,255,.12));
      }
      #boot .mark svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #boot .name {
        color: #f7f7f7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        font-size: 22px;
        font-weight: 520;
        letter-spacing: -0.045em;
        margin-top: 4px;
      }
      @media (max-height: 520px) {
        #boot .mark { width: min(42vh, 180px); height: min(42vh, 180px); }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 220 220" role="presentation">
          <defs>
            <radialGradient id="splash-pick-fill" cx="38%" cy="14%" r="92%">
              <stop offset="0" stop-color="#454545" />
              <stop offset=".24" stop-color="#272727" />
              <stop offset=".58" stop-color="#101010" />
              <stop offset=".88" stop-color="#030303" />
              <stop offset="1" stop-color="#000" />
            </radialGradient>
            <linearGradient id="splash-pick-rim" x1=".13" y1=".08" x2=".91" y2=".88">
              <stop offset="0" stop-color="#858585" />
              <stop offset=".2" stop-color="#f7f7f7" />
              <stop offset=".48" stop-color="#777" />
              <stop offset=".72" stop-color="#f4f4f4" />
              <stop offset="1" stop-color="#8b8b8b" />
            </linearGradient>
            <radialGradient id="splash-pick-glow" cx="78%" cy="10%" r="78%">
              <stop offset="0" stop-color="#fff" stop-opacity=".92" />
              <stop offset=".2" stop-color="#fff" stop-opacity=".38" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="splash-pick-specular" cx="85%" cy="8%" r="85%">
              <stop offset="0" stop-color="#fff" stop-opacity=".54" />
              <stop offset=".28" stop-color="#fff" stop-opacity=".12" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </radialGradient>
            <filter id="splash-pick-blur" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="13" />
            </filter>
            <filter id="splash-pick-soft-blur" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur stdDeviation="4" />
            </filter>
            <filter id="splash-pick-shadow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
              <feOffset dy="5" result="offset" />
              <feComponentTransfer><feFuncA type="linear" slope=".65" /></feComponentTransfer>
              <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
            <path id="splash-pick-shape" d="M110 18C78 18 47 26 37 55c-10 29 7 72 30 106 17 25 34 41 44 41 11 0 28-16 45-41 23-34 40-77 30-106-10-29-41-37-76-37Z" />
            <clipPath id="splash-pick-clip"><use href="#splash-pick-shape" /></clipPath>
          </defs>
          <ellipse cx="166" cy="30" rx="42" ry="36" fill="url(#splash-pick-glow)" filter="url(#splash-pick-blur)" />
          <use href="#splash-pick-shape" fill="none" stroke="url(#splash-pick-rim)" stroke-width="3" opacity=".88" filter="url(#splash-pick-blur)" />
          <use href="#splash-pick-shape" fill="url(#splash-pick-fill)" stroke="url(#splash-pick-rim)" stroke-width="1.35" filter="url(#splash-pick-shadow)" />
          <g clip-path="url(#splash-pick-clip)">
            <ellipse cx="161" cy="39" rx="58" ry="35" fill="url(#splash-pick-specular)" />
            <path d="M43 58c17-25 53-36 87-35 26 1 47 9 58 24" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="2.2" />
            <path d="M47 62c15-21 47-31 77-30" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="5" filter="url(#splash-pick-soft-blur)" />
          </g>
          <path d="M39 63c-7 32 11 72 34 104 9 12 18 22 26 28" fill="none" stroke="#f5bd83" stroke-opacity=".82" stroke-width="1.65" />
          <path d="M148 26c18 2 34 11 41 25" fill="none" stroke="#fff" stroke-opacity=".82" stroke-width="1.45" />
          <circle cx="181" cy="34" r="2.2" fill="#fff" filter="url(#splash-pick-soft-blur)" />
          <circle cx="181" cy="34" r="1.1" fill="#fff" />
        </svg>
      </div>
      <div class="name">MyGitHub</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

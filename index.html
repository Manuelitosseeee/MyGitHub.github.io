<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>MyGitHub — Metronomo e Studio</title>
    <meta
      name="description"
      content="Metronomo avanzato, libreria di brani con tracking automatico del BPM, accordatore per chitarra e registro delle corde."
    />
    <meta name="theme-color" content="#0B0E13" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyGitHub" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/icons/apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        background: #0b0e13;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(120% 90% at 50% 0%, #161c26 0%, #0b0e13 70%);
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .mark {
        width: 92px;
        height: 92px;
        border-radius: 24px;
        background: linear-gradient(160deg, #2c3848 0%, #10151d 100%);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e8edf3;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: -2px;
      }
      #boot .name {
        color: #e8edf3;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.4px;
      }
      #boot .bar {
        width: 110px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #boot .bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 2px;
        background: #3b82f6;
        animation: bootload 1.1s ease-in-out infinite;
      }
      @keyframes bootload {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(280%);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="mark">M</div>
      <div class="name">MyGitHub</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>MyGitHub — Metronomo e Studio</title>
    <meta
      name="description"
      content="Metronomo avanzato, libreria di brani con tracking automatico del BPM, accordatore per chitarra e registro delle corde."
    />
    <meta name="theme-color" content="#0B0E13" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyGitHub" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/icons/apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        background: #050608;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(90% 60% at 50% 0%, #22262c 0%, #050608 74%);
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .mark {
        width: 92px;
        height: 92px;
        border-radius: 28px;
        background: linear-gradient(145deg, rgba(255,255,255,.2), rgba(255,255,255,.025) 55%), #101216;
        border: 1px solid rgba(255,255,255,.48);
        box-shadow: 0 12px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.48), 1px 0 rgba(42,211,255,.4), -1px 0 rgba(255,164,89,.28);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: -2px;
      }
      #boot .name {
        color: #f7f8fa;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.4px;
      }
      #boot .bar {
        width: 110px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #boot .bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, #57deff, #fff 52%, #ffbf68);
        animation: bootload 1.1s ease-in-out infinite;
      }
      @keyframes bootload {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(280%);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="mark" aria-label="MyGitHub">
        <svg viewBox="0 0 64 64" width="48" height="48" aria-hidden="true">
          <path d="M32 8 13 47h38L32 8Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
          <path d="m32 8 10 34" fill="none" stroke="#aeeeff" stroke-width="3" stroke-linecap="round"/>
          <circle cx="44" cy="47" r="3.5" fill="#fff"/>
        </svg>
      </div>
      <div class="name">MyGitHub</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

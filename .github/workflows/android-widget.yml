name: Build Android friend widget
on:
  push:
    branches: [main, feat/amici-pixel-live]
    paths: ['native-android/**', '.github/workflows/android-widget.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p native-android assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MyGuitarHub-Android
          path: native-android/app/build/outputs/apk/debug/app-debug.apk

name: Verifica MyGuitarHub Amici
on:
  push:
    branches:
      - feature/amici-pixel-story-20261102
  pull_request:
    paths:
      - 'src/**'
      - 'functions/**'
      - 'migrations/**'
      - 'tests/**'
      - 'package*.json'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: API Amici tests
        run: npm run test:friends
      - name: Existing unit tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Upload Vite build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: myguitarhub-amici-dist
          path: dist/
          retention-days: 3

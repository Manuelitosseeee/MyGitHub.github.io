name: Pixel Story hands and face QA
on:
  push:
    branches:
      - fix/pixel-hand-motion-face-20261102
  workflow_dispatch:
jobs:
  pixel:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/pixel-hands-face.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-hands-face-qa
          path: pixel-hands-qa/
          retention-days: 4

name: MyGuitarHub real D1 friendship flow
on:
  push:
    branches: [feature/amici-pixel-story-20261102]
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test friendship flow against real Cloudflare D1
        run: node tests/amici-live-api.mjs
